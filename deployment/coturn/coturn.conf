# Coturn TURN/STUN server config — Thooku Madurai
# Run on a small VPS (DigitalOcean/Hetzner/Vultr, ~$4-6/mo) with a public IP.
# REST API: a free/hobby tier with UDP ports. Render free tier does NOT expose
# UDP, so this must live on a normal VPS, NOT Render.
#
# Required: open these ports in the firewall/NAT:
#   3478  UDP+TCP  (TURN/STUN listening)
#   443   TCP      (TURN over TLS / TURN+TLS)
#   49160-49200 UDP (relay port range, must match relay-port-range)

listening-port=3478
tls-listening-port=8443

# Public IP of this server (IMPORTANT — set to your VPS IPv4)
# outer-ip=<YOUR_VPS_IP>

# Internal IP (commonly 0.0.0.0 / the container / VPS LAN IP)
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Username/password pair the backend will send to clients.
# Generate with:
#   turnadmin -k -u thooku -r thookumadurai
# Put the resulting hex key in `static-auth-secret` style below is one way;
# simpler for this app: static-userdb legacy style.
userdb=/etc/coturn/turnuserdb.conf

# If you prefer long-term static credentials instead of turnuserdb, uncomment:
# lt-cred-mech
# To use a shared secret (recommended):
# static-auth-secret=REPLACE_WITH_LONG_RANDOM_SECRET
# use-auth-secret

# Realms
realm=thookumadurai

# Relay range for media (must match firewall/NAT)
min-port=49160
max-port=49200

# Allow binding to loopback etc.
no-loopback-peers
no-multicast-peers

# Keep relays going even with no P2P
# no-stun
fingerprint

# Logging
log-file=/var/log/coturn/coturn.log
simple-log

# TLS certs (optional; only needed if you advertise turns: or want TLS TURN).
# For the free metered fallback we keep plain UDP/TCP only — TLS needs a
# real cert. Point to your own if you have one.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Forkless operation under docker
forever-daemon=no
pidfile=/var/run/coturn.pid