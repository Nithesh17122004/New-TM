# Coturn TURN/STUN server config - Thooku Madurai
# Run on the Oracle Cloud Always Free VM (NOT Render - Render has no UDP).
#
# Before first start, run:  deployment/coturn/setup.sh
# It fills in __PUBLIC_IP__/__PRIVATE_IP__ and generates the credential file.
#
# Firewall rules required (Oracle VCN Security List AND OS firewall):
#   3478       UDP + TCP   (TURN/STUN listening)
#   49160-49200 UDP        (relay range, must match min-port/max-port)

# --- Listening ------------------------------------------------------------
listening-port=3478
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Oracle VMs have a private IP (10.x.x.x) behind a NAT public IP.
# Without this, relay candidates advertise 10.x.x.x and no client can reach
# them. setup.sh replaces the placeholders with the real addresses.
external-ip=__PUBLIC_IP__/__PRIVATE_IP__

# --- Credentials (long-term mechanism + userdb file) ----------------------
# The key in turnuserdb.conf is generated by setup.sh (turnadmin -k).
# Backend env vars must match:
#   TURN_SERVER_URL=turn:__PUBLIC_IP__:3478?transport=udp
#   TURN_SERVER_USERNAME=thooku
#   TURN_SERVER_CREDENTIAL=<plaintext password chosen during setup>
lt-cred-mech
userdb-file-path=/etc/coturn/turnuserdb.conf
realm=thookumadurai

# --- Relay ----------------------------------------------------------------
min-port=49160
max-port=49200
fingerprint
no-loopback-peers
no-multicast-peers

# --- Logging (to docker logs) ---------------------------------------------
log-file=stdout
simple-log

# --- Run under docker -----------------------------------------------------
forever-daemon=no
pidfile=/var/run/coturn.pid
