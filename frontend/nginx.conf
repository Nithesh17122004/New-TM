# Thooku Madurai - frontend nginx config (Docker / VPS)
# Referenced by deployment/Dockerfile.frontend, which copies this file to
# /etc/nginx/nginx.conf inside the nginx:alpine image.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback - all unknown paths serve the app shell
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Basic caching for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
    }
}